name: Build Windows application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package SOC Audit for Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build application
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SOC-Audit-Windows-x64
          path: dist/SOC-Audit-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
